name: blind_social
description: Görme engelliler için erişilebilir iletişim ağı.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Backend
  supabase_flutter: ^2.6.0
  
  # Real-time & Communication
  flutter_webrtc: ^0.10.0
  livekit_client: ^2.1.0
  
  # UI & Icons
  lucide_icons: ^0.7.1
  google_fonts: ^6.2.1
  
  # Utils
  intl: ^0.19.0
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.8
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true
