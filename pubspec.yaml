name: blind_social
description: Görme engelliler için erişilebilir iletişim ağı.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Backend
  supabase_flutter: ^2.12.2
  
  # Real-time & Communication
  flutter_webrtc: 1.4.0
  livekit_client: ^2.7.0
  
  # UI & Icons
  lucide_icons: ^0.257.0
  google_fonts: ^8.0.2
  
  # Utils
  intl: ^0.20.2
  uuid: ^4.5.3
  flutter_dotenv: ^5.1.0
  dart_jsonwebtoken: ^2.14.0
  record: ^6.2.0
  audioplayers: ^6.1.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.8
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true
  assets:
    - .env
