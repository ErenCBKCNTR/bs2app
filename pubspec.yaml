name: blind_social
description: Görme engelliler için erişilebilir iletişim ağı.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.6.1

  # Backend
  pocketbase: ^0.20.0
  
  # Real-time & Communication
  livekit_client: ^2.7.0
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^18.0.0
  
  # UI & Icons
  google_fonts: ^8.0.2
  
  # Utils
  intl: ^0.20.2
  flutter_dotenv: ^5.1.0
  dart_jsonwebtoken: ^3.4.0
  record: ^6.2.0
  audioplayers: ^6.1.1
  just_audio: ^0.9.42
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  shared_preferences: ^2.5.1
  vibration: ^3.1.8
  sqflite: ^2.3.3+3
  share_plus: ^10.1.3
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/sounds/
